[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-postgres-backup-restore"
version = "0.1.0"
description = "Django management commands for encrypted PostgreSQL backups and restores"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Primal100" }]
dependencies = [
    "Django>=4.2",
    "cryptography>=41",
    "google-api-python-client>=2",
    "google-auth>=2",
    "google-auth-httplib2>=0.2",
    "psutil>=5.9",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
gcs = ["google-cloud-storage>=2"]
test = ["pytest>=8", "pytest-django>=4.8"]
publish = ["build>=1.2", "twine>=5"]

[tool.setuptools.packages.find]
include = ["django_postgres_backup_restore*"]
